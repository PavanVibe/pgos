version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pgos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pgos_user
      POSTGRES_PASSWORD: pgos_password
      POSTGRES_DB: pgos_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pgos-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
